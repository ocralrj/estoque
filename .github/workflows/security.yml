name: Segurança

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog — segredos
    runs-on: ubuntu-latest
    steps:
      - name: Obter histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar segredos expostos
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  semgrep:
    name: Semgrep — SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Executar análise estática
        run: semgrep scan --config auto --error
