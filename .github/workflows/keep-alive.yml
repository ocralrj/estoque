name: Manter Supabase ativo

# Única rotina anti-pausa do projeto. O Vercel Cron foi descartado porque
# agendamentos exigem plano Pro — no Hobby a Vercel recusa o vercel.json
# e o deploy falha antes mesmo de compilar.
# O projeto gratuito do Supabase é pausado após ~7 dias sem uso.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de keep-alive
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Defina os secrets APP_URL e CRON_SECRET no repositório." >&2
            exit 1
          fi

          status=$(curl --silent --show-error --location \
            --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --output /tmp/keep-alive.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/internal/keep-alive")

          echo "HTTP $status"
          cat /tmp/keep-alive.json

          if [ "$status" != "200" ]; then
            echo "Keep-alive falhou." >&2
            exit 1
          fi
